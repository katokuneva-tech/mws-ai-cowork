body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"MTS Text","Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

p{margin:0;color:var(--ink2);font-size:.9375rem;line-height:1.5}
form{display:grid;gap:10px}
input{font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:500;font-size:.9375rem;padding:13px 20px;border:0;border-radius:14px;background:var(--ink);color:var(--panel);cursor:pointer}

.err{color:var(--accent);font-size:.875rem;min-height:1.2em}

<script>
(function(){
  var data=JSON.parse(document.getElementById('payload').textContent);
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),btn=document.getElementById('btn');
  async function open(password){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(data.salt),iterations:data.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(data.iv)},key,b(data.ct));
    return new TextDecoder().decode(pt);
  }
  async function tryOpen(password,silent){
    btn.disabled=true;err.textContent='';
    try{
      var html=await open(password);
      try{sessionStorage.setItem('cw_guide_pw',password);}catch(e){}
      document.open();document.write(html);document.close();
    }catch(e){
      btn.disabled=false;
      if(!silent){err.textContent='Пароль не подошёл';pw.select();}
    }
  }
  f.addEventListener('submit',function(e){e.preventDefault();tryOpen(pw.value.trim(),false);});
  if(!window.isSecureContext||!crypto.subtle){err.textContent='Откройте страницу по https';}
  try{var saved=sessionStorage.getItem('cw_guide_pw');if(saved)tryOpen(saved,true);}catch(e){}
})();
</script>
